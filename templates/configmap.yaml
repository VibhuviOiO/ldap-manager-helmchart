{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ldap-manager.configMapName" . }}
  labels:
    {{- include "ldap-manager.labels" . | nindent 4 }}
data:
  {{ .Values.config.key }}: |
{{ include "ldap-manager.configYml" . | indent 4 }}
{{- end }}
